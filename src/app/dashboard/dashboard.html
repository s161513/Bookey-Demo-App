<div class="app-container">
  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-comments"></i></div>
      <h1 class="logo-text">Bookey</h1>
    </div>

    <nav class="nav-menu">
      <a href="#" class="nav-item active">
        <i class="fas fa-inbox icon"></i>
        <span class="label">Inbox</span>
        <span class="badge">3</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-paper-plane icon"></i>
        <span class="label">Sent</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-cog icon"></i>
        <span class="label">Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="company-info">
        <p class="company-label">Company:</p>
        <p class="company-name">Kapper Katrien</p>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Show detail view if message selected -->
    <ng-container *ngIf="selectedMessage; else inboxView">
      <app-message-detail
        [message]="selectedMessage"
        (backClick)="onBackFromDetail()"
        (sendReply)="onReplyMessage($event)">
      </app-message-detail>
    </ng-container>

    <!-- Show inbox view if no message selected -->
    <ng-template #inboxView>
      <!-- Header -->
      <header class="inbox-header">
        <h2 class="inbox-title">Inbox</h2>
        <div class="header-controls">
          <input
            type="text"
            class="search-input"
            placeholder="Search messages..."
            [(ngModel)]="searchQuery"
            (input)="onSearchChange(searchQuery)" />
          <select
            class="filter-select"
            [(ngModel)]="filterOption"
            (change)="onFilterChange(filterOption)">
            <option>All messages</option>
            <option>Unread</option>
            <option>Read</option>
          </select>
        </div>
      </header>

      <!-- Messages List -->
      <div class="messages-container">
        <div
          class="message-item"
          *ngFor="let msg of filteredMessages"
          (click)="onMessageClick(msg)">
          <div class="message-avatar" [style.background]="msg.avatarGradient">
            <span class="avatar-text">{{ msg.avatarText }}</span>
          </div>
          <div class="message-content">
            <div class="message-header">
              <h3 class="sender-name">{{ msg.senderName }}</h3>
              <span class="message-time">{{ msg.time }}</span>
            </div>
            <p class="sender-email">{{ msg.senderEmail }}</p>
            <p class="message-text">{{ msg.messageText }}</p>
            <div class="message-meta">
              <span class="status-badge" [class.new]="msg.status === 'New'" [class.read]="msg.status === 'Read'">
                {{ msg.status }}
              </span>
              <span class="time-badge"><i class="fas fa-clock"></i> {{ msg.time }}</span>
              <span class="date-badge">{{ msg.date }}</span>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </main>
</div>
