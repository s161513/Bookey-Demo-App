<div class="appointments-container">
  <!-- Header -->
  <header class="appointments-header">
    <h2 class="appointments-title">Appointment Requests</h2>
    <div class="filter-tabs">
      <button
        class="filter-tab"
        [class.active]="activeFilter === 'Pending'"
        (click)="setFilter('Pending')">
        Pending
        <span class="tab-count" *ngIf="pendingCount > 0">{{ pendingCount }}</span>
      </button>
      <button
        class="filter-tab"
        [class.active]="activeFilter === 'Accepted'"
        (click)="setFilter('Accepted')">
        Accepted
      </button>
      <button
        class="filter-tab"
        [class.active]="activeFilter === 'Denied'"
        (click)="setFilter('Denied')">
        Denied
      </button>
    </div>
  </header>

  <!-- Request list -->
  <div class="requests-list">
    <div class="empty-state" *ngIf="filteredRequests.length === 0">
      <i class="fas fa-calendar-check empty-icon"></i>
      <p>No {{ activeFilter.toLowerCase() }} requests</p>
    </div>

    <div class="request-card" *ngFor="let req of filteredRequests">
      <!-- Card left: avatar + info -->
      <div class="card-main">
        <div class="customer-avatar" [style.background]="req.avatarGradient">
          {{ req.avatarText }}
        </div>

        <div class="card-info">
          <div class="card-top">
            <span class="customer-name">{{ req.customerName }}</span>
            <span class="received-at">{{ req.receivedAt }}</span>
          </div>
          <span class="customer-email">{{ req.customerEmail }}</span>

          <div class="appointment-details">
            <span class="detail-item">
              <i class="fas fa-scissors"></i>
              {{ req.service }}
            </span>
            <span class="detail-item">
              <i class="fas fa-calendar"></i>
              {{ req.requestedDate }}
            </span>
            <span class="detail-item">
              <i class="fas fa-clock"></i>
              {{ req.requestedTime }}
            </span>
          </div>

          <p class="request-note" *ngIf="req.note">
            <i class="fas fa-quote-left note-icon"></i>
            {{ req.note }}
          </p>
        </div>
      </div>

      <!-- Actions / status -->
      <div class="card-actions" *ngIf="req.status === 'Pending'">
        <button class="btn btn-deny" (click)="deny(req)">
          <i class="fas fa-xmark"></i> Deny
        </button>
        <button class="btn btn-accept" (click)="accept(req)">
          <i class="fas fa-check"></i> Accept
        </button>
      </div>

      <div class="status-indicator" *ngIf="req.status !== 'Pending'" [class.accepted]="req.status === 'Accepted'" [class.denied]="req.status === 'Denied'">
        <i class="fas" [class.fa-check]="req.status === 'Accepted'" [class.fa-xmark]="req.status === 'Denied'"></i>
        {{ req.status }}
      </div>
    </div>
  </div>
</div>
